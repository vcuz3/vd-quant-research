[datasets.audusd]
source = "ibkr"
symbol = "AUDUSD"
granularity = "1h"
bar_size = "1 hour"
price_type = "MIDPOINT"
units = "USD per AUD"
observation_timezone = "UTC"
chunk_months = 1 # Calendar-month chunks for hourly/daily bars.
boundary_padding_days = 1 # Retain overlap so IBKR session boundaries cover UTC start.
pacing_seconds = 10
methodology_ref = "ibkr_audusd"

